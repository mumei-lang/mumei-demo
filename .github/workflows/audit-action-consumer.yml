name: Audit Action Golden Path Consumer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-action-consumer.yml
      - docs/CI_REFERENCE.md
      - scenarios/ci_evidence_pack/src/**
      - templates/payment-ledger-starter/**
      - tests/test_build_ci_evidence_pack.py
      - tests/test_payment_starter_template.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  documented-consumer-path:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Deliberately fake outer values: the documented step-level empty env must
      # hide them so the audit remains deterministic/no-LLM. These are not secrets.
      LLM_API_KEY: fake-unused-llm-key
      OPENAI_API_KEY: fake-unused-llm-key
      LLM_BASE_URL: http://127.0.0.1:9
    steps:
      - name: Checkout mumei-demo
        uses: actions/checkout@v7

      - name: Create bootstrap consumer fixture
        shell: bash
        run: |
          mkdir -p src
          cp templates/payment-ledger-starter/src/payment_ledger.py src/payment_ledger.py
          printf '%s\n' '{"version":"mumei.audit-baseline/v1","fingerprints":[]}' > audit-baseline.json

      - name: Run documented deterministic audit action
        id: audit
        uses: mumei-lang/mumei-agent/.github/actions/mumei-audit@2384e18d257ef089673dcefd26a3ddfa5e490645
        env:
          LLM_API_KEY: ""
          OPENAI_API_KEY: ""
        with:
          code-file: src/
          language: python
          mumei-version: v0.7.1
          audit-args: --baseline audit-baseline.json --write-baseline .mumei-audit/generated-baseline.json --fail-on high-confidence
          migration-execution-output: .mumei-audit/migration_execution.json
          artifact-name: mumei-audit-evidence
          upload-sarif: false

      - name: Validate action outputs and pre-publication summary markdown
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.audit_exit_code }}
          SETUP_SECONDS: ${{ steps.audit.outputs.setup_seconds }}
          AUDIT_SECONDS: ${{ steps.audit.outputs.audit_seconds }}
          TOTAL_SECONDS: ${{ steps.audit.outputs.total_seconds }}
          MIGRATION_STATUS: ${{ steps.audit.outputs.migration_execution_status }}
          READY_COUNT: ${{ steps.audit.outputs.migration_execution_ready_count }}
          OPERATIONAL_ERROR_COUNT: ${{ steps.audit.outputs.migration_execution_operational_error_count }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          assert os.environ["AUDIT_EXIT_CODE"] == "0"
          assert os.environ["MIGRATION_STATUS"] == "emitted_by_audit_cli"
          assert os.environ["OPERATIONAL_ERROR_COUNT"] == "0"
          for name in ("SETUP_SECONDS", "AUDIT_SECONDS", "TOTAL_SECONDS", "READY_COUNT"):
              value = os.environ[name]
              assert value.isdigit(), f"{name} is not a non-negative integer: {value!r}"

          summary_dir = Path(os.environ["RUNNER_TEMP"]) / "_runner_file_commands"
          summaries = sorted(summary_dir.glob("step_summary_*"))
          assert summaries, "no rendered step summary files found"
          summary_text = "\n".join(path.read_text(encoding="utf-8", errors="replace") for path in summaries)
          for fragment in (
              "## Mumei audit",
              "### migration execution",
              "`--auto-migrate` was added automatically",
              "Consumer policy: candidate `operational_error` fails the action",
          ):
              assert fragment in summary_text, f"rendered step summary is missing {fragment!r}"

          # Only the first (empty-baseline) audit has run at this point, so every
          # Mumei audit summary file belongs to it. Record the filenames so the
          # baselined validation can tell the two runs apart.
          mumei_summaries = [
              path for path in summaries
              if "## Mumei audit" in path.read_text(encoding="utf-8", errors="replace")
          ]
          assert mumei_summaries, "no Mumei audit step summary found"
          first_text = "\n".join(path.read_text(encoding="utf-8", errors="replace") for path in mumei_summaries)
          for fragment in (
              "### findings",
              "Active findings: `2`; suppressed by baseline: `0`",
              "encoding-gap: fee_cents",
              "spec precondition assumed",
              "do not reflect baseline suppression policy",
              "src/payment_ledger.py",
          ):
              assert fragment in first_text, f"first-run summary is missing {fragment!r}"
          assert "/home/runner/work/" not in first_text, "runner absolute path leaked into the summary"
          state = Path(os.environ["RUNNER_TEMP"]) / "first-run-summary-files.txt"
          state.write_text("\n".join(path.name for path in mumei_summaries) + "\n", encoding="utf-8")
          PY

      - name: Adopt generated baseline as input policy
        shell: bash
        run: |
          # Reproduce the documented consumer loop: a human reviews the
          # artifact's generated-baseline.json and commits it as audit-baseline.json.
          test -s .mumei-audit/generated-baseline.json
          cp .mumei-audit/generated-baseline.json audit-baseline.json

      - name: Run audit again with adopted baseline
        id: audit-baselined
        uses: mumei-lang/mumei-agent/.github/actions/mumei-audit@2384e18d257ef089673dcefd26a3ddfa5e490645
        env:
          LLM_API_KEY: ""
          OPENAI_API_KEY: ""
        with:
          code-file: src/
          language: python
          mumei-version: v0.7.1
          audit-args: --baseline audit-baseline.json --write-baseline .mumei-audit/generated-baseline.json --fail-on high-confidence
          migration-execution-output: .mumei-audit/migration_execution-baselined.json
          artifact-name: mumei-audit-evidence-baselined
          upload-sarif: false

      - name: Validate baselined action outputs
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit-baselined.outputs.audit_exit_code }}
          MIGRATION_STATUS: ${{ steps.audit-baselined.outputs.migration_execution_status }}
          OPERATIONAL_ERROR_COUNT: ${{ steps.audit-baselined.outputs.migration_execution_operational_error_count }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Exit 0 is expected in both runs and is not round-trip improvement
          # evidence; the verify job asserts suppression state instead.
          assert os.environ["AUDIT_EXIT_CODE"] == "0"
          assert os.environ["MIGRATION_STATUS"] == "emitted_by_audit_cli"
          assert os.environ["OPERATIONAL_ERROR_COUNT"] == "0"

          # Identify the baselined run's Mumei audit summary files by excluding
          # the filenames recorded after the first run.
          state = Path(os.environ["RUNNER_TEMP"]) / "first-run-summary-files.txt"
          first_names = set(state.read_text(encoding="utf-8").split())
          summary_dir = Path(os.environ["RUNNER_TEMP"]) / "_runner_file_commands"
          baselined_summaries = [
              path for path in sorted(summary_dir.glob("step_summary_*"))
              if path.name not in first_names
              and "## Mumei audit" in path.read_text(encoding="utf-8", errors="replace")
          ]
          assert baselined_summaries, "no baselined Mumei audit step summary found"
          second_text = "\n".join(path.read_text(encoding="utf-8", errors="replace") for path in baselined_summaries)
          for fragment in (
              "### findings",
              "Active findings: `0`; suppressed by baseline: `2`",
              "Suppressed by baseline (still reported, not deleted)",
              "encoding-gap: fee_cents",
              "do not reflect baseline suppression policy",
              "src/payment_ledger.py",
          ):
              assert fragment in second_text, f"baselined summary is missing {fragment!r}"
          assert "/home/runner/work/" not in second_text, "runner absolute path leaked into the baselined summary"
          PY

  verify-downloaded-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: documented-consumer-path
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download golden-path evidence artifact
        uses: actions/download-artifact@v7
        with:
          name: mumei-audit-evidence
          path: evidence

      - name: Fetch pinned consumer artifact verifier
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/mumei-lang/mumei-agent/2384e18d257ef089673dcefd26a3ddfa5e490645/.github/actions/mumei-audit/scripts/verify_audit_evidence_artifact.py \
            -o verify_audit_evidence_artifact.py

      - name: Verify downloaded golden-path artifact
        shell: bash
        run: |
          python3 verify_audit_evidence_artifact.py evidence \
            --require-hidden-companion \
            --require-blocked-candidate \
            --require-generated-mm \
            --forbidden-literal fake-unused-llm-key

      - name: Download baselined evidence artifact
        uses: actions/download-artifact@v7
        with:
          name: mumei-audit-evidence-baselined
          path: evidence-baselined

      - name: Verify downloaded baselined artifact
        shell: bash
        run: |
          python3 verify_audit_evidence_artifact.py evidence-baselined \
            --require-hidden-companion \
            --require-blocked-candidate \
            --require-generated-mm \
            --forbidden-literal fake-unused-llm-key

      - name: Verify baseline suppression round-trip
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("evidence/audit.json").read_text(encoding="utf-8"))
          second = json.loads(Path("evidence-baselined/audit.json").read_text(encoding="utf-8"))

          # Negative control: the first run ships an empty fingerprint list, so
          # every finding stays actively reported and none is suppressed.
          first_states = [finding.get("baseline") for finding in first.get("findings", [])]
          assert first_states, "first artifact carries no findings"
          assert "new" in first_states, "first run must report active findings"
          assert "suppressed" not in first_states, "empty baseline must not suppress anything"

          # Round-trip evidence: after adopting the generated baseline, the same
          # findings flip to suppressed rows instead of being deleted, and no new
          # active code finding remains. The exit code is 0 in both runs and is
          # not improvement evidence.
          second_states = [finding.get("baseline") for finding in second.get("findings", [])]
          assert second_states, "baselined artifact carries no findings"
          assert "suppressed" in second_states, "adopted baseline must suppress at least one finding"
          assert "new" not in second_states, "no new active finding may remain after full adoption"

          # Baseline suppression acts on findings, not migration candidates: the
          # fixture blocked candidate must survive the adopted baseline.
          execution = json.loads(Path("evidence-baselined/migration-execution/migration_execution.json").read_text(encoding="utf-8"))
          candidates = execution.get("candidates")
          assert len(candidates) == 1
          assert candidates[0].get("function_name") == "split_cents"
          assert candidates[0].get("execution_state") == "blocked"

          encoded = json.dumps(execution)
          assert "fake-unused-llm-key" not in encoded
          assert "127.0.0.1:9" not in encoded
          PY

      - name: Verify empty env hid outer LLM configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          execution = json.loads(Path("evidence/migration-execution/migration_execution.json").read_text(encoding="utf-8"))
          candidates = execution.get("candidates")
          assert len(candidates) == 1
          assert candidates[0].get("function_name") == "split_cents"
          assert candidates[0].get("execution_state") == "blocked"
          assert execution.get("summary", {}).get("review_required") is True

          erosion_statuses = {
              "passed", "failed", "inconclusive", "unavailable", "malformed",
              "operational_error", "skipped_no_change", "not_checked",
          }
          allowed_erosion_keys = {
              "status", "checked", "reason", "summary", "source",
              "atom_count", "eroded_atom_count", "atoms",
          }
          forbidden_erosion_key_parts = ("counterexample", "stdout", "stderr", "report", "detail")

          def validate_migration_contract_provenance(rows):
              for candidate in rows:
                  erosion = candidate.get("contract_erosion")
                  assert isinstance(erosion, dict)
                  assert erosion.get("status") in erosion_statuses
                  assert type(erosion.get("checked")) is bool
                  assert type(erosion.get("atom_count")) is int
                  assert type(erosion.get("eroded_atom_count")) is int
                  assert isinstance(erosion.get("atoms"), list)
                  assert erosion.get("summary") is None or isinstance(erosion.get("summary"), str)
                  assert erosion.get("reason") is None or isinstance(erosion.get("reason"), str)
                  assert erosion.get("source") is None or isinstance(erosion.get("source"), str)
                  assert set(erosion) <= allowed_erosion_keys
                  assert not any(
                      part in key.lower()
                      for key in erosion
                      for part in forbidden_erosion_key_parts
                  )
                  for atom in erosion["atoms"]:
                      assert isinstance(atom, dict)
                      assert set(atom) <= {"name", "status"}
                      assert isinstance(atom.get("name"), str)
                      assert isinstance(atom.get("status"), str)

                  provenance = candidate.get("contract_provenance")
                  assert isinstance(provenance, dict)
                  for delta_name in ("requires_delta", "ensures_delta"):
                      delta = provenance.get(delta_name)
                      assert isinstance(delta, dict)
                      assert isinstance(delta.get("added"), list)
                      assert isinstance(delta.get("removed"), list)
                      assert all(isinstance(item, str) for item in delta["added"])
                      assert all(isinstance(item, str) for item in delta["removed"])

          validate_migration_contract_provenance(candidates)

          non_empty_valid = json.loads(json.dumps(candidates))
          non_empty_valid[0]["contract_erosion"]["atoms"].append({"name": "sample atom", "status": "preserved"})
          non_empty_valid[0]["contract_provenance"]["requires_delta"]["added"].append("sample requirement")
          validate_migration_contract_provenance(non_empty_valid)

          def expect_invalid_provenance(label, mutate):
              mutated = json.loads(json.dumps(candidates))
              mutate(mutated)
              try:
                  validate_migration_contract_provenance(mutated)
              except AssertionError:
                  return
              raise AssertionError(f"malformed contract provenance was accepted: {label}")

          expect_invalid_provenance(
              "non-integer atom count",
              lambda rows: rows[0]["contract_erosion"].__setitem__("atom_count", {}),
          )
          expect_invalid_provenance(
              "atom missing name",
              lambda rows: rows[0]["contract_erosion"]["atoms"].append({"status": "preserved"}),
          )
          expect_invalid_provenance(
              "non-string requires delta item",
              lambda rows: rows[0]["contract_provenance"]["requires_delta"]["added"].append(1),
          )

          audit = json.loads(Path("evidence/audit.json").read_text(encoding="utf-8"))
          assert any(
              hint.get("function_name") == "split_cents" and hint.get("priority") == "high"
              for hint in audit.get("migration_hints", [])
          )

          encoded = json.dumps(execution)
          assert "LLM_API_KEY (or OPENAI_API_KEY) is not set" in encoded
          assert "fake-unused-llm-key" not in encoded
          assert "127.0.0.1:9" not in encoded
          PY
