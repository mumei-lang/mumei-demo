name: specimens

on:
  pull_request:
    branches: [main]
    paths:
      - "specimens/**"
      - "scripts/check_specimens.py"
      - "tests/test_check_specimens.py"
      - "scripts/run_specimen_audits.py"
      - "tests/test_run_specimen_audits.py"
      - "scripts/run_baselines.py"
      - "tests/test_run_baselines.py"
      - "tests/test_run_llm_only.py"
      - "scripts/run_llm_only.py"
      - "tests/test_compare_arms.py"
      - "scripts/compare_arms.py"
      - "README.md"
      - "proofs/**"
      - "scripts/run_contract_bench.py"
      - "tests/test_run_contract_bench.py"
      - "scripts/run_native_replay.py"
      - "tests/test_run_native_replay.py"
      - "scripts/run_mutation_control.py"
      - "tests/test_run_mutation_control.py"
      - "scripts/run_regression_gate.py"
      - "tests/test_run_regression_gate.py"
      - ".github/workflows/specimens.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Validate specimens
        run: python3 scripts/check_specimens.py
      - name: Run validator tests
        run: python3 -m pytest tests/test_check_specimens.py -q
      - name: Run audit-runner tests
        run: python3 -m pytest tests/test_run_specimen_audits.py -q
      - name: Run baseline-runner tests
        run: python3 -m pytest tests/test_run_baselines.py -q
      - name: Run LLM-only runner tests
        run: python3 -m pytest tests/test_run_llm_only.py -q
      - name: Run comparison tests
        run: python3 -m pytest tests/test_compare_arms.py -q
      - name: Check the committed comparison is up to date
        run: python3 scripts/compare_arms.py --model openai/gpt-6-luna --check
      - name: Run contract-benchmark tests
        run: python3 -m pytest tests/test_run_contract_bench.py -q
      - name: Check contract-benchmark cases and results (offline)
        run: python3 scripts/run_contract_bench.py --check
      - name: Run native-replay tests
        run: python3 -m pytest tests/test_run_native_replay.py -q
      - name: Check native-replay results (offline)
        run: python3 scripts/run_native_replay.py --check
      - name: Run mutation-control tests
        run: python3 -m pytest tests/test_run_mutation_control.py -q
      - name: Check the mutation-control result (offline)
        run: python3 scripts/run_mutation_control.py --check
      - name: Run regression-gate tests
        run: python3 -m pytest tests/test_run_regression_gate.py -q
      - name: Check the regression-gate report (offline)
        run: python3 scripts/run_regression_gate.py --check
