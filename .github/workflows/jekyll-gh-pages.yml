# Deploys the docs site to GitHub Pages via the shared reusable workflow in
# mumei-lang/mumei (B3, mumei-lang/mumei#1449). Deploy logic — Jekyll build,
# deploy retries, permissions — lives in one place.
name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: mumei-lang/mumei/.github/workflows/jekyll-gh-pages.yml@develop
