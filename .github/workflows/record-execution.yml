name: Record execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-execution:
    name: Fixed record execution regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_record_execution.py -q --junitxml=reports/record-execution-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-execution-tests
          path: reports/record-execution-tests.xml
          if-no-files-found: error
