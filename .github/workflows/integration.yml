name: Integration Demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  charter-baseline-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish reviewed inputs and their change diff
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ -n "$BASE_COMMIT" ] && [[ ! "$BASE_COMMIT" =~ ^0+$ ]]; then
            args+=(--base "$BASE_COMMIT")
          fi
          python scripts/review_charter_baseline.py "${args[@]}" --out-dir reports/charter-baseline
          cat reports/charter-baseline/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charter-baseline-review
          path: reports/charter-baseline/
          if-no-files-found: error

  evidence-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check Make is available for reference tests
        run: make --version
      - run: python -m pytest tests/test_scenario_evidence.py tests/test_run_scenario.py tests/test_generate_report.py tests/test_evidence_regressions.py tests/test_review_charter_baseline.py tests/test_record_scenario.py tests/test_record_model_evidence.py tests/test_reference.py -q --junitxml=reports/evidence-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-contract-tests
          path: reports/evidence-tests.xml

  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei
          ref: develop
          path: repos/mumei
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-lean
          ref: develop
          path: repos/mumei-lean
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-agent
          ref: develop
          path: repos/mumei-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3 + LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev pkg-config libssl-dev libzstd-dev z3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libclang-17-dev libpolly-17-dev
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> "$GITHUB_ENV"
      - name: Build mumei
        run: cargo build --release
        working-directory: repos/mumei
      - name: Install mumei-agent deps
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install -r requirements.txt
          else
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install -e ".[test]"
          fi
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip show openai
        working-directory: repos/mumei-agent
      - name: Run integrated demo scenarios
        run: make demo-ci
        env:
          CI_FIXTURE_MODE: "1"
          MUMEI_REPO: ${{ github.workspace }}/repos/mumei
          MUMEI_LEAN_REPO: ${{ github.workspace }}/repos/mumei-lean
          MUMEI_AGENT_REPO: ${{ github.workspace }}/repos/mumei-agent
          MUMEI_AGENT_PYTHON: ${{ github.workspace }}/.venv/bin/python
          MUMEI_BIN: ${{ github.workspace }}/repos/mumei/target/release/mumei
      - name: Generate report
        if: always()
        run: python scripts/generate_report.py --summary --highlights --require-all
      - name: Install pinned Lean for the optional record experiment
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/elan toolchain install "$(cat repos/mumei-lean/lean-toolchain)"
      - name: Check separate record model and execution evidence
        run: make demo-record-execution
        env:
          CI_FIXTURE_MODE: "1"
          MUMEI_REPO: ${{ github.workspace }}/repos/mumei
          MUMEI_LEAN_REPO: ${{ github.workspace }}/repos/mumei-lean
          MUMEI_AGENT_REPO: ${{ github.workspace }}/repos/mumei-agent
          MUMEI_BIN: ${{ github.workspace }}/repos/mumei/target/release/mumei
      - name: Check synthetic evidence regressions against the real Charter run
        if: always()
        run: python scripts/check_evidence_regressions.py reports/charter_gate_demo/latest/result.json --out-dir reports/charter_regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports
          path: reports/
