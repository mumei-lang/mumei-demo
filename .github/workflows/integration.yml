name: Integration Demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei
          ref: develop
          path: repos/mumei
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-lean
          ref: develop
          path: repos/mumei-lean
      - uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-agent
          ref: develop
          path: repos/mumei-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3 + LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev pkg-config libssl-dev libzstd-dev z3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libclang-17-dev libpolly-17-dev
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> "$GITHUB_ENV"
      - name: Build mumei
        run: cargo build --release
        working-directory: repos/mumei
      - name: Install mumei-agent deps
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install -r requirements.txt
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip show openai
        working-directory: repos/mumei-agent
      - name: Run integrated demo scenarios
        run: make demo-ci
        env:
          CI_FIXTURE_MODE: "1"
          MUMEI_REPO: ${{ github.workspace }}/repos/mumei
          MUMEI_LEAN_REPO: ${{ github.workspace }}/repos/mumei-lean
          MUMEI_AGENT_REPO: ${{ github.workspace }}/repos/mumei-agent
          MUMEI_AGENT_PYTHON: ${{ github.workspace }}/.venv/bin/python
          MUMEI_BIN: ${{ github.workspace }}/repos/mumei/target/release/mumei
      - name: Generate report
        if: always()
        run: python scripts/generate_report.py --summary --highlights --require-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports
          path: reports/
