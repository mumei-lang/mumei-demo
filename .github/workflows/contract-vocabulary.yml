# Cross-repo note (mumei-lang/mumei#1500): the composite action owns only
# the common Python/dependency runner. mumei-demo's path filter and checks are
# repo-specific because this repository owns scenario.json contracts and demo
# documentation aliases rather than the canonical proof or MCP schemas.
name: Contract Vocabulary

on:
  pull_request:
    branches: [main]
    paths:
      - 'scenarios/spec_code_verification_suite/scenario.json'
      - 'scenarios/no_mm_audit/scenario.json'
      - 'scenarios/no_mm_audit/README.md'
      - 'scenarios/spec_code_verification_suite/README.md'
      - 'README.md'
      - 'docs/HARNESS_CONTRACTS.md'
      - 'docs/ROADMAP.md'
      - 'docs/SCENARIO_SPEC.md'
      - 'scripts/check_scenario_contracts.py'
      - 'tests/test_check_scenario_contracts.py'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_attempt }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenario-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run contract vocabulary checks
        uses: mumei-lang/mumei/.github/actions/contract-vocabulary@develop
        with:
          python_version: '3.12'
          install_command: python3 -m pip install --quiet pytest
          check_command: |
            python3 scripts/check_scenario_contracts.py
            python3 -m pytest tests/test_check_scenario_contracts.py -v
