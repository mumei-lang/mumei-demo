name: Mumei audit evidence reference

# Initial audit-only adoption gate. The mumei-demo ci_evidence_pack scenario
# demonstrates the richer migration-plan/reference-certificate evidence pack.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Needed for uploading the audit CLI's SARIF rendering to code scanning.
  # No token or secret value is written to the evidence pack.
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  audit-evidence-pack:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
    steps:
      - name: Check out the audited repository
        uses: actions/checkout@v7

      - name: Check out mumei
        uses: actions/checkout@v7
        with:
          repository: mumei-lang/mumei
          ref: develop
          path: .mumei/mumei

      - name: Check out mumei-agent
        uses: actions/checkout@v7
        with:
          repository: mumei-lang/mumei-agent
          ref: develop
          path: .mumei/mumei-agent

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Z3 and LLVM 17
        run: |
          # The hosted runner's unused Microsoft package feed intermittently returns 403.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y libz3-dev pkg-config libssl-dev libzstd-dev z3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename="$(lsb_release -cs)"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libclang-17-dev libpolly-17-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve mumei dependency versions
        run: cargo generate-lockfile
        working-directory: .mumei/mumei

      - name: Cache mumei build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .mumei/mumei
          shared-key: audit-reference

      - name: Build mumei
        run: cargo build --release --locked
        working-directory: .mumei/mumei

      - name: Install mumei-agent dependencies
        run: |
          python -m venv "$GITHUB_WORKSPACE/.mumei/.venv"
          "$GITHUB_WORKSPACE/.mumei/.venv/bin/python" -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            "$GITHUB_WORKSPACE/.mumei/.venv/bin/python" -m pip install -r requirements.txt
          else
            "$GITHUB_WORKSPACE/.mumei/.venv/bin/python" -m pip install -e ".[test]"
          fi
        working-directory: .mumei/mumei-agent

      # Bootstrap path: the first run writes evidence-pack/audit-baseline.json.
      # Review that artifact, commit it as .mumei/audit-baseline.json in the
      # audited repository, and later runs pass it through --baseline so only
      # new high-confidence code evidence fails the gate.
      - name: Run deterministic audit
        env:
          # Empty values keep the current audit CLI on its deterministic parser
          # path even when a local .env exists in a development checkout.
          LLM_API_KEY: ""
          OPENAI_API_KEY: ""
          CI_FIXTURE_MODE: "1"
          MUMEI_BIN: ${{ github.workspace }}/.mumei/mumei/target/release/mumei
          AUDIT_TARGET: ${{ github.workspace }}/src
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence-pack"
          rm -f "$GITHUB_WORKSPACE/evidence-pack/migration_execution.json"
          rm -f "$GITHUB_WORKSPACE/evidence-pack/migration_execution.status.txt"
          rm -rf "$GITHUB_WORKSPACE/evidence-pack/migration_execution.migration-execution"
          rm -rf "$GITHUB_WORKSPACE/evidence-pack/migration_execution.migration-execution"-*
          baseline_input="$GITHUB_WORKSPACE/.mumei/audit-baseline.json"
          if [ ! -f "$baseline_input" ]; then
            baseline_input="$RUNNER_TEMP/mumei-empty-audit-baseline.json"
            printf '%s\n' '{"version":"mumei.audit-baseline/v1","fingerprints":[]}' > "$baseline_input"
            echo "no reviewed baseline found; using an empty bootstrap baseline"
          fi
          migration_args=()
          if "$GITHUB_WORKSPACE/.mumei/.venv/bin/mumei-agent" audit --help 2>/dev/null | grep -q -- '--migration-execution-output'; then
            migration_args=(--migration-execution-output "$GITHUB_WORKSPACE/evidence-pack/migration_execution.json")
            echo "emitted_by_audit_cli" > "$GITHUB_WORKSPACE/evidence-pack/migration_execution.status.txt"
          else
            echo "not_available_in_current_cli" > "$GITHUB_WORKSPACE/evidence-pack/migration_execution.status.txt"
          fi
          set +e
          "$GITHUB_WORKSPACE/.mumei/.venv/bin/mumei-agent" audit \
            --code-file "$AUDIT_TARGET" \
            --format json \
            --auto-migrate \
            --sarif-output "$GITHUB_WORKSPACE/evidence-pack/audit.sarif" \
            --baseline "$baseline_input" \
            --write-baseline "$GITHUB_WORKSPACE/evidence-pack/audit-baseline.json" \
            --fail-on high-confidence \
            "${migration_args[@]}" \
            > "$GITHUB_WORKSPACE/evidence-pack/audit.json" \
            2> "$GITHUB_WORKSPACE/evidence-pack/audit.stderr.log"
          audit_exit=$?
          set -e
          cat "$GITHUB_WORKSPACE/evidence-pack/audit.stderr.log" >&2
          echo "$audit_exit" > "$GITHUB_WORKSPACE/evidence-pack/audit.exitcode.txt"
          if [ ! -s "$GITHUB_WORKSPACE/evidence-pack/audit.json" ]; then
            echo "audit did not produce contract JSON" >&2
            exit 2
          fi
          if [ ! -s "$GITHUB_WORKSPACE/evidence-pack/audit.sarif" ]; then
            echo "audit did not produce SARIF" >&2
            exit 2
          fi
          if [ ! -s "$GITHUB_WORKSPACE/evidence-pack/audit-baseline.json" ]; then
            echo "audit did not refresh the baseline" >&2
            exit 2
          fi
          # Exit 1 is the upstream finding-policy failure. Preserve the uploaded
          # artifacts through the always() steps below while still failing the gate.
          exit "$audit_exit"

      - name: Validate current audit contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              "spec_health_issues", "verification_violations", "verification_status",
              "cross_validation_gaps", "next_steps", "migration_hints",
              "healed_files", "heal_errors", "trusted_atoms",
          ]
          payload = json.loads(Path("evidence-pack/audit.json").read_text())
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"audit contract missing keys: {missing}")
          sarif = json.loads(Path("evidence-pack/audit.sarif").read_text())
          if sarif.get("version") != "2.1.0" or not sarif.get("runs"):
              raise SystemExit("audit.sarif is not a SARIF 2.1.0 document")
          baseline = json.loads(Path("evidence-pack/audit-baseline.json").read_text())
          if baseline.get("version") != "mumei.audit-baseline/v1" or not isinstance(baseline.get("fingerprints"), list):
              raise SystemExit("audit-baseline.json is not mumei.audit-baseline/v1")
          print(f"audit status: {payload.get('verification_status')}")
          print(f"migration candidates: {len(payload.get('migration_hints', []))}")
          print(f"baseline fingerprints: {len(baseline['fingerprints'])}")
          migration_status = Path("evidence-pack/migration_execution.status.txt").read_text().strip()
          execution_path = Path("evidence-pack/migration_execution.json")
          if migration_status == "emitted_by_audit_cli":
              if not execution_path.is_file():
                  raise SystemExit("capable audit CLI did not write migration_execution.json")
              execution = json.loads(execution_path.read_text())
              if execution.get("schema") != "mumei.migration-execution/v1":
                  raise SystemExit("migration_execution.json is not mumei.migration-execution/v1")
              candidates = execution.get("candidates")
              summary = execution.get("summary")
              if not isinstance(candidates, list) or not isinstance(summary, dict):
                  raise SystemExit("migration execution candidates or summary are malformed")
              source = execution.get("source")
              selection = execution.get("selection")
              if (not isinstance(source, dict) or {"path", "language", "kind", "sha256"} - set(source)
                      or source.get("kind") not in {"file", "directory"}):
                  raise SystemExit("migration execution source provenance is malformed")
              if (not isinstance(selection, dict) or {"basis", "requested_functions", "missing_requested_functions"} - set(selection)
                      or not isinstance(selection.get("requested_functions"), list)
                      or not isinstance(selection.get("missing_requested_functions"), list)):
                  raise SystemExit("migration execution selection metadata is malformed")
              states = {"not_attempted", "blocked", "operational_error", "ready_for_human_review"}
              candidate_required = {
                  "function_name", "source_provenance", "selection", "extracted_contract", "generated_mm",
                  "heal", "verification", "unbound_audit_diagnostics", "contract_provenance",
                  "evidence_blockers", "operational_errors", "review_required", "execution_state",
              }
              if any(not isinstance(row, dict) or candidate_required - set(row) or row.get("execution_state") not in states
                     or not isinstance(row.get("review_required"), bool) for row in candidates):
                  raise SystemExit("migration execution candidate contract is malformed")
              counts = {
                  "candidate_count": len(candidates),
                  "ready_for_human_review": sum(row.get("execution_state") == "ready_for_human_review" for row in candidates),
                  "blocked": sum(row.get("execution_state") == "blocked" for row in candidates),
                  "operational_error": sum(row.get("execution_state") == "operational_error" for row in candidates),
              }
              if any(summary.get(key) != value for key, value in counts.items()):
                  raise SystemExit("migration execution summary does not match candidate execution states")
              if summary.get("review_required") is not bool(candidates or selection["missing_requested_functions"]):
                  raise SystemExit("migration execution summary review_required is inconsistent")
              if not isinstance(execution.get("operational_errors"), list):
                  raise SystemExit("migration execution operational errors are malformed")
              artifact_paths = execution.get("artifact_paths")
              if (not isinstance(artifact_paths, dict)
                      or not isinstance(artifact_paths.get("migration_execution"), str)
                      or not isinstance(artifact_paths.get("generated_artifacts"), str)):
                  raise SystemExit("migration execution artifact paths are malformed")
              recorded_output = Path(artifact_paths["migration_execution"])
              if not recorded_output.is_absolute():
                  recorded_output = execution_path.parent / recorded_output
              if recorded_output.resolve() != execution_path.resolve():
                  raise SystemExit("migration execution artifact path does not match the audit output file")
              generated_dir = Path(artifact_paths["generated_artifacts"]).resolve()
              try:
                  generated_dir.relative_to(Path("evidence-pack").resolve())
              except ValueError:
                  raise SystemExit("migration execution generated artifact directory escapes evidence-pack") from None
              if not generated_dir.is_dir():
                  raise SystemExit("capable audit CLI did not write the migration execution generated artifact directory")
              evidence_boundary = execution.get("evidence_boundary")
              if not isinstance(evidence_boundary, list) or not all(isinstance(item, str) for item in evidence_boundary):
                  raise SystemExit("migration execution evidence boundary is malformed")
              boundary = "\n".join(evidence_boundary)
              if "not proof that host-language code implements the same behavior" not in boundary:
                  raise SystemExit("migration execution evidence boundary does not exclude host semantic equivalence")
              print(f"migration execution candidates: {len(candidates)}")
          else:
              if execution_path.exists():
                  raise SystemExit("migration_execution.json exists even though the CLI does not support it")
              print("migration execution: not_available_in_current_cli")
          PY

      - name: Write job summary
        if: always()
        run: |
          {
            echo "# Mumei audit evidence"
            echo
            echo "- deterministic/no-LLM audit mode"
            echo "- audit JSON: \`evidence-pack/audit.json\`"
            echo "- SARIF: \`evidence-pack/audit.sarif\` emitted by the upstream audit CLI"
            echo "- baseline: \`evidence-pack/audit-baseline.json\` is CI policy, not evidence"
            echo "- migration execution: \`$(cat evidence-pack/migration_execution.status.txt 2>/dev/null || echo not_available_in_current_cli)\`; never host semantic-equivalence proof"
            echo "- fail-on policy: \`high-confidence\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF when the audit CLI emits it
        if: always() && hashFiles('evidence-pack/audit.sarif') != ''
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: evidence-pack/audit.sarif

      - name: Record SARIF upload outcome
        if: always()
        run: |
          echo "- code scanning upload: ${{ steps.upload-sarif.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mumei-audit-evidence-pack
          path: evidence-pack/
          if-no-files-found: error
